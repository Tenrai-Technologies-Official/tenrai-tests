[package]
name = "quic-check"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio = { version = "1.43.0", features = ["macros", "rt-multi-thread", "net", "time"] }
